name: Deploy Web Flasher

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'firmware/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare fresh web files
        run: |
          rm -rf site
          cp -R web site
          mkdir -p site/firmware
          cp firmware/aura-e32r28t.bin "site/firmware/aura-e32r28t-${GITHUB_SHA}.bin"
          cp firmware/cyd-mp3player.bin site/firmware/cyd-mp3player.bin

          export DEPLOY_VERSION="$GITHUB_SHA"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("site")
          version = os.environ["DEPLOY_VERSION"]

          manifest = json.loads((root / "manifest-pages.json").read_text())
          manifest["version"] = version
          manifest["builds"][0]["parts"][0]["path"] = f"./firmware/aura-e32r28t-{version}.bin"
          (root / "manifest-pages.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )

          index = (root / "index.html").read_text()
          index = index.replace(
              'manifest="./manifest-pages.json"',
              f'manifest="./manifest-pages.json?v={version}"'
          )
          (root / "index.html").write_text(index)
          PY

      - name: Verify deployed firmware inputs
        run: |
          test -s "site/firmware/aura-e32r28t-${GITHUB_SHA}.bin"
          grep -q "aura-e32r28t-${GITHUB_SHA}.bin" site/manifest-pages.json
          test -s site/firmware/cyd-mp3player.bin
          grep -q "../firmware/cyd-mp3player.bin" site/mp3/manifest.json
          grep -q "manifest-pages.json?v=${GITHUB_SHA}" site/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

