name: Build CYD MP3Player LVGL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cyd-mp3player.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyd-mp3player-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout upstream MP3 player source
        uses: actions/checkout@v4
        with:
          repository: embedded-kiddie/CYD_MP3Player
          ref: main
          path: upstream

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and pinned libraries
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "LVGL@9.2.2"
          arduino-cli lib install "LovyanGFX@1.2.7"
          arduino-cli lib install "SdFat@2.3.0"
          arduino-cli lib install "ArduinoJson@7.4.2"

      - name: Prepare sketch and LVGL configuration
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          cp upstream/CYD_MP3Player_LVGL/assets/lv_conf/lv_conf.9.2.2.h "$HOME/Arduino/libraries/lv_conf.h"
          mkdir -p build-src
          cp -R upstream/CYD_MP3Player_LVGL build-src/CYD_MP3Player_LVGL
          # The upstream project vendors LVGL private headers that do not match LVGL 9.2.2.
          # Use the exact private headers from the pinned LVGL library for a reproducible build.
          cp "$HOME/Arduino/libraries/lvgl/src/draw/lv_image_decoder_private.h" build-src/CYD_MP3Player_LVGL/src/tjpgd/draw/lv_image_decoder_private.h
          cp "$HOME/Arduino/libraries/lvgl/src/misc/lv_fs_private.h" build-src/CYD_MP3Player_LVGL/src/tjpgd/misc/lv_fs_private.h
          # Arduino CLI is resolving the LVGL headers but not linking its implementation sources;
          # compile the pinned LVGL source tree as part of the sketch to ensure all LVGL symbols exist.
          mkdir -p build-src/CYD_MP3Player_LVGL/src/lvgl
          cp -R "$HOME/Arduino/libraries/lvgl/src" build-src/CYD_MP3Player_LVGL/src/lvgl/src
          # LVGL internal files use relative includes to the public root header.
          cp "$HOME/Arduino/libraries/lvgl/lvgl.h" build-src/CYD_MP3Player_LVGL/src/lvgl/lvgl.h
          cp "$HOME/Arduino/libraries/lvgl/lv_version.h" build-src/CYD_MP3Player_LVGL/src/lvgl/lv_version.h
          # This sketch uses LovyanGFX and does not enable LVGL optional drivers/libraries.
          # Remove their sources and the corresponding unconditional public-header includes.
          rm -rf build-src/CYD_MP3Player_LVGL/src/lvgl/src/drivers
          find build-src/CYD_MP3Player_LVGL/src/lvgl/src/libs -mindepth 1 -maxdepth 1 ! -name bin_decoder ! -name rle -exec rm -rf {} +
          sed -i '/#include "src\/libs\//d; /#include "src\/drivers\/lv_drivers.h"/d' build-src/CYD_MP3Player_LVGL/src/lvgl/lvgl.h
          # LVGL core initializes the binary decoder when LV_USE_BIN_DECODER is enabled.
          sed -i '/#include "src\/layouts\/lv_layout.h"/i #include "src/libs/bin_decoder/lv_bin_decoder.h"' build-src/CYD_MP3Player_LVGL/src/lvgl/lvgl.h
          # VG-Lite is an optional GPU backend and its sources include optional FreeType internals.
          # The CYD uses LovyanGFX and does not enable LVGL VG-Lite.
          rm -rf build-src/CYD_MP3Player_LVGL/src/lvgl/src/draw/vg_lite
          grep -Eq '^[[:space:]]*#define CYD_2432S028R_1USB' build-src/CYD_MP3Player_LVGL/config.h
          grep -Eq '^[[:space:]]*#define USE_LOVYANGFX' build-src/CYD_MP3Player_LVGL/config.h

      - name: Compile for ESP32-2432S028R
        run: |
          mkdir -p build/out
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --board-options PartitionScheme=huge_app \
            --libraries "$HOME/Arduino/libraries" \
            --build-property "compiler.cpp.extra_flags=-DLV_CONF_INCLUDE_SIMPLE -I$HOME/Arduino/libraries -I$HOME/Arduino/libraries/lvgl/src -I$HOME/Arduino/libraries/lvgl/src/draw -I$HOME/Arduino/libraries/lvgl/src/misc -I$GITHUB_WORKSPACE/build-src/CYD_MP3Player_LVGL/src/lvgl/src" \
            --build-property "compiler.c.extra_flags=-DLV_CONF_INCLUDE_SIMPLE -I$HOME/Arduino/libraries -I$HOME/Arduino/libraries/lvgl/src -I$HOME/Arduino/libraries/lvgl/src/draw -I$HOME/Arduino/libraries/lvgl/src/misc -I$GITHUB_WORKSPACE/build-src/CYD_MP3Player_LVGL/src/lvgl" \
            --export-binaries \
            --output-dir build/out \
            build-src/CYD_MP3Player_LVGL

      - name: Merge bootloader, partitions, boot_app0 and application
        run: |
          python3 -m pip install --upgrade esptool
          mkdir -p firmware
          python3 -m esptool --chip esp32 merge-bin \
            --output firmware/cyd-mp3player.bin \
            --flash-mode dio \
            --flash-freq 40m \
            --flash-size 4MB \
            0x1000 build/out/CYD_MP3Player_LVGL.ino.bootloader.bin \
            0x8000 build/out/CYD_MP3Player_LVGL.ino.partitions.bin \
            0xe000 "$HOME/.arduino15/packages/esp32/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin" \
            0x10000 build/out/CYD_MP3Player_LVGL.ino.bin
          test -s firmware/cyd-mp3player.bin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyd-mp3player-esp32-2432s028r
          path: firmware/cyd-mp3player.bin
          if-no-files-found: error

      - name: Commit firmware for GitHub Pages deployment
        uses: EndBug/add-and-commit@v9
        with:
          add: firmware/cyd-mp3player.bin
          message: "Build CYD MP3Player LVGL firmware"
