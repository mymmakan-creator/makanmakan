<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura E32R28T Web Flasher</title>
<style>
body{font-family:system-ui,sans-serif;background:#101827;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
.card{width:min(520px,calc(100% - 32px));background:#182235;border-radius:24px;padding:32px;box-sizing:border-box}
esp-web-install-button{display:block;margin:24px 0}
.muted{color:#aeb9cc;line-height:1.5}
</style>
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>
<body>
<div class="card">
<h1>Aura Weather</h1>
<p class="muted">ESP32-32E / LCDWIKI E32R28T<br>ILI9341 · 2.8" · 240×320</p>
<esp-web-install-button manifest="./manifest-pages.json"></esp-web-install-button>
<p class="muted">Use Chrome or Edge on desktop. Connect the board by USB. The installer will erase the flash and write the complete firmware.</p>
</div>
</body>
</html>
