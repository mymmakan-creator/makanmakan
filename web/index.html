<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aura E32R28T Web Flasher</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(520px,calc(100% - 32px));background:#182235;border-radius:24px;padding:32px;box-sizing:border-box}button{width:100%;padding:16px;border:0;border-radius:12px;background:#4f8cff;color:#fff;font-size:18px;font-weight:700}.muted{color:#aeb9cc;line-height:1.5}</style></head><body><div class="card"><h1>Aura Weather</h1><p class="muted">ESP32-32E / LCDWIKI E32R28T<br>ILI9341 • 2.8" • 240×320</p><button id="install">Connect & Install</button><p id="status">Ready.</p><p class="muted">Use Chrome or Edge on desktop. Connect the board by USB.</p></div><script type="module">import {install} from "https://unpkg.com/@webinstaller/webinstaller@latest/dist/webinstaller.js";const b=document.querySelector("#install"),s=document.querySelector("#status");b.onclick=async()=>{try{s.textContent="Connecting…";await install(await (await fetch("./manifest.json")).json());s.textContent="Installation complete. Reset the ESP32."}catch(e){s.textContent="Installation cancelled or failed: "+e.message}};</script></body></html>
